name: Spec Drift Check

on:
  schedule:
    - cron: '0 6 * * 1'     # Weekly on Monday 6 AM UTC
  workflow_dispatch:          # Manual trigger
    inputs:
      update_spec:
        description: 'Auto-update the spec file for backward-compatible drift'
        required: false
        type: boolean
        default: true

jobs:
  spec-drift:
    name: Detect and Fix Spec Drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install specdrift
      run: pip install -e ".[dev,test-api]"

    # You can replace this with a staging/production URL
    - name: Start test API
      run: |
        cd test_api && uvicorn main:app --port 8000 &
        sleep 3

    - name: Run SpecDrift scan
      id: drift
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        specdrift scan \
          --config spec_drift_agent.config.json \
          --update-spec \
          --json \
          --model gemini-2.5-flash \
          > drift_report.json 2>&1 || true

        # Check if spec was updated on disk
        if git diff --quiet; then
          echo "spec_changed=false" >> $GITHUB_OUTPUT
        else
          echo "spec_changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Upload drift report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: drift-report
        path: drift_report.json

    # If spec was updated, create a PR for review
    - name: Create PR with spec updates
      if: steps.drift.outputs.spec_changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'fix(spec): auto-update OpenAPI spec for detected drift'
        title: '🔄 Auto-update OpenAPI spec — drift detected'
        body: |
          ## Spec Drift Auto-Update

          SpecDrift detected drift between the API responses and the OpenAPI
          specification. The following **backward-compatible** changes were
          auto-applied.

          Please review the diff and merge if the changes look correct.

          > Generated by [SpecDrift Agent](${{ github.server_url }}/${{ github.repository }})
        branch: spec-drift/auto-update
        labels: spec-drift, automated
        delete-branch: true
